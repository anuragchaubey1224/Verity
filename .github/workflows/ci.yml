name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Compile check
        run: python -m compileall -q backend main.py

      - name: Migration graph check
        env:
          OPENROUTER_API_KEY: ci-placeholder
          POSTGRES_URL: postgresql+asyncpg://postgres:password@localhost:5432/verity
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-placeholder
        run: python -m alembic heads

      - name: Run tests
        run: python -m pytest -q

      - name: Build backend image
        run: docker build --tag verity-backend:ci .

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
